[project]
name = "audiolab"
version = "0.1.0"
description = "A lab for speech experiments, written by LLM agents and meant to be read by humans."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.2,<3",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.optional-dependencies]
# Running a local model (`audiolab serve`, `audiolab train`) needs NeMo and
# PyTorch; nothing else does, so they live in an extra: `uv sync` stays light,
# and the test suite never imports them (see docs/stt/training.md). Install it
# with `uv sync --extra nemo`.
nemo = [
    "nemo_toolkit[asr]==2.6.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "lightning==2.4.0",
    "torchmetrics==1.6.1",
    # The TDT loss is a Numba CUDA kernel; these are the versions that build it
    # for the recent GPUs the extra is used on. NeMo requires the same two.
    "numba==0.61.2",
    "numba-cuda==0.15.1",
    "cuda-python==12.8.0",
]

[project.scripts]
audiolab = "audiolab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiolab"]

[[tool.uv.index]]
# PyTorch 2.8.0 with CUDA 12.8 is the build the `nemo` extra was verified with.
# The index is explicit, so only torch and torchaudio may come from it.
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
# The `nemo` extra is resolved for Linux only: its pins were verified on the
# serving and training GPUs, and no other platform installs it. Everything else
# in the lock is platform independent.
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
