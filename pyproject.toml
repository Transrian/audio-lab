[project]
name = "audiolab"
version = "0.1.0"
description = "A lab for speech experiments, written by LLM agents and meant to be read by humans."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    # The local model stack (requirements/nemo.txt) pins numba, which does not
    # accept numpy 2.3 or later; 2.2 is the floor the code needs and the
    # ceiling belongs to that stack, not to the default install.
    "numpy>=2.2,<3",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
audiolab = "audiolab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiolab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
