# Per-source screening, 2026-11-08: one short fine-tune per training source, all
# with the same clips count, updates and recipe, so that the evaluation of the
# final checkpoint against the base model shows what this source brings on its
# own. Only the dataset (and the GPU it ran on) differs between the
# screen-*.yaml files. Why these numbers: docs/stt/screening.md.
base_model: nvidia/parakeet-tdt-0.6b-v3
base_model_env: AUDIOLAB_PARAKEET_NEMO
dataset: pxcorpus-fr-train

# Not the 10 000 of the other arms: this source has 1 912 clips in total, so
# every clip it has is presented 16.7 times instead of 3.2. The screening
# compares sources at an equal number of clips, so this arm is not comparable
# with the others on that axis; docs/stt/datasets.md says how to read it.
clips: 1912
updates: 2000
# 16 clips per update. Two at a time is what fits clips of up to 20 s of dense
# read speech in 32 GB (four already does not).
batch_size: 2
grad_accumulation: 8
max_clip_seconds: 20.0

# The earlier private project's per-source screening rates, full encoder,
# constant (decision 0004 keeps a constant rate).
lr_encoder: 1.0e-5
lr_heads: 3.0e-5
weight_decay: 1.0e-3
schedule: constant
warmup_updates: 0
precision: bf16-mixed
grad_clip: 1.0

workers: 4
gpu: "1"
seed: 20261107
resume_every: 500
log_every: 50
