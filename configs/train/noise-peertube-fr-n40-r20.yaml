# Noise test against the peertube-fr screen (plan 02): the control run
# screen-peertube-fr with noise mixed into 40 % of the clips at 0-20 dB, and
# reverb (a room impulse response) convolved into 20 % of them. Same base,
# clips, updates and recipe as the control - the only difference is the
# augmentation, so the difference in the scores comes from it. Why these
# numbers: docs/stt/screening.md, "Noise augmentation".
base_model: nvidia/parakeet-tdt-0.6b-v3
base_model_env: AUDIOLAB_PARAKEET_NEMO
dataset: peertube-fr-train

clips: 10000
updates: 2000
# 16 clips per update. Two at a time is what fits clips of up to 20 s of dense
# read speech in 32 GB (four already does not).
batch_size: 2
grad_accumulation: 8
max_clip_seconds: 20.0

# The earlier private project's per-source screening rates, full encoder,
# constant (decision 0004 keeps a constant rate).
lr_encoder: 1.0e-5
lr_heads: 3.0e-5
weight_decay: 1.0e-3
schedule: constant
warmup_updates: 0
precision: bf16-mixed
grad_clip: 1.0

workers: 4
gpu: "0"
seed: 20261107
resume_every: 500
log_every: 50

# The augmentation under test: noise on 40 % of the clips, from musan-noise
# (its train half only - the eval half is what the noisy panels of the suite
# score against), at a random signal-to-noise ratio of 0-20 dB; reverb on
# 20 % of the clips, from the train half of rirs-noises.
noise_prob: 0.4
noise_bank: musan-noise
noise_min_snr_db: 0.0
noise_max_snr_db: 20.0
reverb_prob: 0.2
reverb_bank: rirs-noises
