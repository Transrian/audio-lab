# Noise test against the peertube-fr screen: the control run screen-peertube-fr
# with noise mixed into 40 % of the clips, at a random signal-to-noise ratio
# of 0-20 dB. The original control was not trained with this config's clip
# order, micro-batch, code or card, so that comparison is not matched; the
# test's matched control is noise-peertube-fr-control-1x16 (the same recipe,
# no augmentation). The verdicts are in docs/stt/screening.md, "Noise
# augmentation", and proposed decision 0015.
base_model: nvidia/parakeet-tdt-0.6b-v3
base_model_env: AUDIOLAB_PARAKEET_NEMO
dataset: peertube-fr-train

clips: 10000
updates: 2000
# 16 clips per update, one at a time: 1 x 16 is what fits the 24 GB cards this
# test runs on (the original control's 2 x 8 peaks at 22.4 GiB on a 32 GB card
# and does not fit). 1 x 16 is not loss-neutral against 2 x 8 under the
# model's mean_volume reduction - that, with the clip order and the code
# version, is why the test carries its own matched control.
batch_size: 1
grad_accumulation: 16
max_clip_seconds: 20.0

# The earlier private project's per-source screening rates, full encoder,
# constant (decision 0004 keeps a constant rate).
lr_encoder: 1.0e-5
lr_heads: 3.0e-5
weight_decay: 1.0e-3
schedule: constant
warmup_updates: 0
precision: bf16-mixed
grad_clip: 1.0

workers: 4
gpu: "0"
seed: 20261107
resume_every: 500
log_every: 50

# The noise under test: musan-noise, its train half only (the eval half is
# what the noisy panels of the suite score against), decision 0004's rate.
noise_prob: 0.4
noise_bank: musan-noise
noise_min_snr_db: 0.0
noise_max_snr_db: 20.0
