# Matched control of the noise test: the screen-peertube-fr recipe with the
# candidates' micro-batch (1 × 16), card class and code, and no augmentation.
# Why: docs/stt/screening.md, "Noise augmentation".
base_model: nvidia/parakeet-tdt-0.6b-v3
base_model_env: AUDIOLAB_PARAKEET_NEMO
dataset: peertube-fr-train

clips: 10000
updates: 2000
# 16 clips per update, one at a time: 1 × 16 is what fits the 24 GB cards this
# test runs on (2 × 8 peaks at 22.4 GiB on a 32 GB card and does not fit in
# 24 GB). 1 × 16 is not loss-neutral against 2 × 8 under the model's
# mean_volume reduction, which is why this control exists.
batch_size: 1
grad_accumulation: 16
max_clip_seconds: 20.0

# The earlier private project's per-source screening rates, full encoder,
# constant (decision 0004 keeps a constant rate).
lr_encoder: 1.0e-5
lr_heads: 3.0e-5
weight_decay: 1.0e-3
schedule: constant
warmup_updates: 0
precision: bf16-mixed
grad_clip: 1.0

workers: 4
gpu: "0"
seed: 20261107
resume_every: 500
log_every: 50
