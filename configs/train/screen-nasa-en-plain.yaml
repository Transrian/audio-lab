# Re-screen of nasa-en-train after the label-character cleanup, 2026-11-13:
# the current set's labels are in the characters the base model can write
# (docs/stt/datasets.md, Training sources). Identical to screen-nasa-en.yaml,
# whose run trained on the curly-apostrophe labels; only the dataset content
# differs. Why these numbers: docs/stt/screening.md.
base_model: nvidia/parakeet-tdt-0.6b-v3
base_model_env: AUDIOLAB_PARAKEET_NEMO
dataset: nasa-en-train

clips: 10000
updates: 2000
# 16 clips per update. Two at a time is what fits clips of up to 20 s of dense
# read speech in 32 GB (four already does not).
batch_size: 2
grad_accumulation: 8
max_clip_seconds: 20.0

# The earlier private project's per-source screening rates, full encoder,
# constant (decision 0004 keeps a constant rate).
lr_encoder: 1.0e-5
lr_heads: 3.0e-5
weight_decay: 1.0e-3
schedule: constant
warmup_updates: 0
precision: bf16-mixed
grad_clip: 1.0

workers: 4
gpu: "0"
seed: 20261107
resume_every: 500
log_every: 50
