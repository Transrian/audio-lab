# CrispASR server on the owner's home server. The URL and the key are read from
# the environment, never written here (D-015). It labels peertube-fr-train
# (docs/stt/datasets.md), which asks it for timestamped segments.
name: whisper-large-v3-crispasr
api: transcriptions
base_url_env: STT_BASE_URL
api_key_env: STT_API_KEY
model: stt-c-whisper-large-v3
send_language: true
server_label: owner's home server
request: {}
