name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the Owner-Approved trailer check

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Repository checks
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Check the commits of this push; check all of them if the previous
          # head is unknown (first push, force push or manual run).
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range=all
          fi
          uv run python scripts/check_repo.py --commits "$range"
